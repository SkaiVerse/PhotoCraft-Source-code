name: PhotoCraft
options:
  deploymentTarget:
    iOS: "18.4"
targets:
  PhotoCraft:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinfor.photocraft
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.P.19"
        CURRENT_PROJECT_VERSION: "__BUILD__"
        SWIFT_OBJC_BRIDGING_HEADER: App/PhotoCraft-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/rust-lib"
        OTHER_LDFLAGS: "-lphotocraft_ios $(NATIVE_LIBS)"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PhotoCraft
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "0.P.19"
        CFBundleVersion: "__BUILD__"
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        NSPhotoLibraryAddUsageDescription: PhotoCraft saves the pictures you export to your Photos library.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
              - com.adobe.photoshop-image
          - CFBundleTypeName: PhotoCraft Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - ai.storyteller.photocraft.document
          - CFBundleTypeName: Brush Library
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.photoshop-brush
              - ai.storyteller.photocraft.procreate-brush
              - ai.storyteller.photocraft.procreate-brushset
              - public.data
              - public.zip-archive
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: ai.storyteller.photocraft.document
            UTTypeDescription: PhotoCraft Document
            UTTypeConformsTo:
              - public.data
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - pcraft
          - UTTypeIdentifier: com.adobe.photoshop-brush
            UTTypeDescription: Photoshop Brush Set
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - abr
          - UTTypeIdentifier: ai.storyteller.photocraft.procreate-brush
            UTTypeDescription: Procreate Brush
            UTTypeConformsTo:
              - public.data
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - brush
          - UTTypeIdentifier: ai.storyteller.photocraft.procreate-brushset
            UTTypeDescription: Procreate Brush Set
            UTTypeConformsTo:
              - public.data
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - brushset
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
